[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ezdl2"
version = "0.1.0"
description = "Robust web page fetching with automatic HTTP-to-browser fallback"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "playwright>=1.44",
    "playwright-stealth>=1.0.6",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpserver>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ezdl2*"]
